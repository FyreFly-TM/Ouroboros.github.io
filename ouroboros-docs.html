<script>window.addEventListener('error',function(e){var a=document.getElementById('article');if(a)a.innerHTML='<h1>Script error</h1><p>'+String(e.message)+' ('+String(e.filename).split('/').pop()+':'+e.lineno+')</p>';});</script><script>/* Ouroboros specification handbook (rewrite). */
window.OURO_DOCS = (() => {
  const pages = [];
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const code = (text, label = 'Ouroboros', language = 'ouro') => `<div class="codeblock"><div class="code-head"><span>${esc(label)}</span><button class="copy-button" aria-label="Copy ${esc(label)} code">Copy code</button></div><pre><code data-language="${language}">${esc(text.trim())}</code></pre></div>`;
  const note = (title, text, warning = false) => `<div class="callout ${warning ? 'warning' : ''}"><strong>${title}</strong>${text}</div>`;
  const table = (headers, rows) => `<div class="table-wrap"><table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const section = (id, title, body) => `<section><h2 id="${id}">${title}<a class="section-link" href="#${id}" aria-label="Link to ${title}">#</a></h2>${body}</section>`;
  const add = (id, group, title, description, sections, extra = {}) => pages.push({id, group, title, description, sections, ...extra});
  const card = (id, icon, title, text) => `<a class="card" href="#${id}"><span class="card-arrow">↗</span><span class="card-icon">${icon}</span><h3>${title}</h3><p>${text}</p></a>`;
  const S = (id, title, ...b) => section(id, title, b.join(''));
  const t = (h, r) => table(h, r);
  const K = x => `<code>${esc(x)}</code>`;

  add('overview','Start here','Code that flows in one line.','Ouroboros is a horizontal language. Values travel along arrows, and the arrow says how: borrowed, async, continuous, iterated, transferred, shared or severed.',[
    S('paths','Choose your path',`<div class="cards">${card('quickstart','01','First flow','Six file types, no imports, one arrow.')}${card('arrows','->','The arrows','Four modifiers generate the whole family.')}${card('ownership','-->','Ownership','Borrow by default. Transfer, share and sever are explicit.')}${card('domains','∇','Domains and MAST','Write math as textbook notation.')}</div>`),
    S('taste','A taste',code(`"Hello, World!" -> Print\ntotal := Prices ~> Sum\nPlayer -[ Score > 90 -> RankS | Score > 70 -> RankA | -> RankC ]-> FinalRank\nPlayers ~[health < 50]~> TriggerWarning`)+'<p>No braces for blocks, no imports. Indentation scopes. Brackets appear inside arrows as conditions and elsewhere as arrays.</p>')
  ],{hero:true});

  add('quickstart','Start here','First flow','A program is files that relate to each other.',[
    S('files','The six file types',t(['File','Holds'],[[K('.ent'),'Entities and the components each group uses'],[K('.var'),'Shared values, structs, enums'],[K('.com'),'Components (data)'],[K('.nod'),'Categories of reusable nodes'],[K('.dom'),'Domains (notation and rules)'],[K('.ouro'),'Main script, where the program runs']]),'<p>Files are checked in the order shown, with <code>.ouro</code> last. No imports are ever needed.</p>'),
    S('first','Hello',code(`"Hello, World!" -> Print`,'Main.ouro'))
  ]);

  add('tour','Start here','Language tour','One pass over everything.',[
    S('tour','Tour',code(`speed i32 =: 5                       // mutable, typed\nlimit := 10                          // constant, inferred\nspeed += 1\nScores := [10, 20, 30]\nScores ~> Print\n~[speed < limit]~> speed++            // loop while true\nPlayer -[ Hold.Key.W ]-> Walk        // tied to Player\n-[ Press.Key.Escape ]-> Quit         // global check`))
  ]);

  add('bindings','Language guide','Bindings and scope','Three operators, three jobs.',[
    S('forms','Declare and reassign',t(['Form','Meaning'],[[K('x := 5'),'declare a constant'],[K('x =: 5'),'declare a mutable'],[K('x = 6'),'reassign only, never declares']]),code(`total := Prices ~> Sum              // a flow on the right\nspeed i32 := 5                      // annotation after the name\n"Hi" -> Print                       // standard destinations`)),
    S('scope','Scope','<p>A name lives to the end of its indented block. An inner block may shadow an outer name. Redeclaring a name in the same block is an error. A name is never declared empty.</p>')
  ]);

  add('types','Language guide','Types','Short names, inferred by default.',[
    S('scalars','Scalars',t(['Kind','Names'],[['Integers',K('i8 i16 i32 i64 u8 u16 u32 u64')+', default '+K('i32')],['Floats',K('f16 f32 f64 f128')+', default '+K('f32')],['Other',K('bool')+' (true, false), '+K('str')+' (text, quoted)']])),
    S('convert','Conversion',code(`Raw -> i32 -> Clamp`),'<p>A type is a destination: the value flows in and comes out converted.</p>')
  ]);

  add('operators','Language guide','Operators','Standard math order, arrow lowest.',[
    S('table','Operators',t(['Kind','Operators'],[['Arithmetic',K('+ - * / % ^')+' (power is '+K('2^2')+')'],['Compound',K('+= -= *= /= ++ --')],['Comparison',K('== != < > <= >=')],['Logic',K('&& || !')]]),'<p>Precedence: <code>^</code>, then <code>* / %</code>, then <code>+ -</code>, comparison, <code>&&</code>, <code>||</code>, and finally the arrow. <code>a + b -> Print</code> prints the sum.</p>'),
    S('bitwise','Bitwise domain',code(`@Bitwise\n    mask := flags & 0xFF\n    bit := flags ^^ mask\n    inv := ~~flags\n    up := flags << 2`),'<p>Symbols: <code>&amp; | ^^ ~~ &lt;&lt; &gt;&gt;</code>. Logical <code>&amp;&amp;</code> and <code>||</code> stay active. Spacing keeps <code>&gt;&gt;</code> apart from <code>-&gt;&gt;</code>, and arrows win ties.</p>')
  ]);

  add('strings','Language guide','Strings and text','Quoted text, interpolation, destinations.',[
    S('interp','Interpolation',code(`"Health of {Name}: {Health}" -> Print\n"Set is {{1, 2}}" -> Print      // doubled braces are literal`),'<p>Braces hold any expression.</p>'),
    S('ops','Text destinations',code(`Name -> Trim -> Len -> Print\nLine, "," >- Split ~> Print`),'<p>Extra inputs use the funnel, never call parentheses.</p>')
  ]);

  add('collections','Language guide','Arrays and maps','Brackets for lists, braces for maps.',[
    S('arrays','Arrays',code(`Scores =: [10, 20, 30]\nScores[0] -> Print                 // 0-based\nScores[1..2] ~> Print              // slice, inclusive\nScores, 40 >- Push\nScores -> Pop -> Print`)),
    S('maps','Maps',code(`key := "health"\nPlayer := {"name": "Fly", key: 80}\nPlayer["name"] -> Print\nPlayer, "name" >- Has`),'<p>A quoted string is always text. A bare name is always a variable. Map destinations: <code>Has Get Del Keys Values</code>.</p>')
  ]);

  add('control-flow','Language guide','Control flow','Conditions are arrows.',[
    S('chain','Chains and match',code(`Player -[ Score > 90 -> RankS\n        | Score > 70 -> RankA\n        | -> RankC ]-> FinalRank\n\nCommand -[ "start" -> Start | "stop" -> Stop | -> Unknown ]-> Result\nReady -[ true -> Go | false -> Wait ]-> Out`),'<p>First true branch wins, and a branch with no condition is the else. A bool expression is a condition; any other plain value is matched against the incoming value. A bitwise OR inside a chain goes in parentheses.</p>'),
    S('loops','Loops',code(`~[count < 10]~> count++               // while true\nGroup ~[health < 1]~> despawn         // filter a source\n0..10 ~> Step                         // fixed count\n~[count < 10 && !Found]~> Search      // exit is the condition`),'<p>The <code>~[</code> marks a loop condition. Skip a pass with <code>-|-></code> in a branch.</p>'),
    S('empty','Empty left side',code(`-> Quit\n-[Press.Key.Escape]-> Quit\nPlayer -[Hold.Key.W]-> Walk`),'<p>With nothing on the left the arrow runs on its own. With a source, the action is tied to that entity.</p>')
  ]);

    S('node','Declaring',code(`// Physics.nod\nnode Damage In[Health i32, Amount i32] Out[Health i32, Dead bool]\n    "negative damage" -[Amount < 0]-> Fail\n    Health - Amount -> Out.Health\n    Health - Amount <= 0 -> Out.Dead`),code(`Player.health, Hit >- Damage ?-> LogError\nDamage.Dead -[ true -> GameOver | -> KeepPlaying ]-> Next`),'<p>A <code>.nod</code> file is a category. Nodes are global and need no imports. If two files declare one name, qualify it: <code>Physics.Damage</code>.</p>')

  add('arrows','Language guide','Arrows','Base symbol plus modifiers. The family is derivable.',[

  add('assembly','Tooling & internals','Inline assembly','A legacy Win64 escape hatch—not portable language code.',[
    section('asm-block','ASM blocks', code(`@ASM {
    ; MASM assembly goes here.
    ; Mixed blocks must not define main proc.
}`) + '<p>Only the ASM target is accepted. A file containing only an ASM block can emit a whole native MASM program. Mixed source injects snippets into lowered code. The interpreter skips ASM; native-only tests handle it separately.</p>'),
    section('asm-symbols','Storage symbols', table(['Symbol','Legacy role'],[['<code>Name_data</code>','16-byte typed payload mirror.'],['<code>Name_heap</code>','Heap handle.'],['<code>Name_hlen</code>','Payload byte length.'],['<code>Proc_loc_Name_*</code>','Mangled procedure-local symbols where applicable.'],['<code>ouro_each_idx_Entity</code>','Current ambient entity slot index.']]) + '<p>These are legacy ABI details, not stable language-level names. The C/x64 IR runtime uses different storage. Ensure register preservation, stack alignment and calling convention correctness in every snippet.</p>'),
    section('asm-coverage','Compatibility', note('Windows/legacy only','General inline assembly is not covered by the portable C backend. Backend auto can fall back, so pin your backend when diagnosing compatibility. Future changes to runtime symbols can break snippets.',true))
  ]);
  add('backends','Tooling & internals','Compiler & backends','Preparation, typed IR, generated C, and Win64 assembly.',[
    section('pipeline','The compilation pipeline','<p>Parse → prepare_program (resolve imports/includes, templates and specializations without running the program) → gradual checking → interpreter or typed IR lowering. IR functions contain blocks and SSA virtual registers; a verifier checks structure/types. Unsupported lowering reports the construct instead of silently pretending it is covered.</p>'),
    section('backend-selection','Backend selection', table(['Backend','Meaning','Platform'],[['auto','Prefer C when IR coverage/toolchain permit; otherwise legacy fallback','Depends on selected backend'],['c','Typed IR → C + portable refcounted runtime','Windows / Linux verified in project notes'],['x64','Typed IR → MASM with frames, register allocation and shared runtime','Win64'],['legacy','Original MASM lowering; needed for ASM and some remaining constructs','Windows']]) + code('python -m ouroboros run main.ouro --backend c\npython -m ouroboros dump-ir main.ouro','Terminal','shell')),
    section('runtime-layout','Two memory models','<p>Interpreter/legacy paths use the project’s rotator/size-class heap model. IR strings/arrays/maps/dynamic boxes use a portable refcounted runtime with copy-on-write and immortal literals. Explicit systems allocation is a separate layer. Historical “no Alloc/Free” notes refer to the old automatic value heap, not the newer systems builtins.</p>'),
    section('abi','Native implementation','<p>The x64 backend uses Win64 argument/return conventions, frame alignment, preserved callee registers, stack probing and linear-scan allocation. The C backend delegates native optimization to the installed compiler. An engine ABI wrapper catalog does not yet provide general-purpose user-declared FFI.</p>')
  ]);
  add('cli','Tooling & internals','Command-line reference','Build, inspect, check, watch, and test a project.',[
    section('commands','Commands', table(['Command','Purpose'],[['<code>python -m ouroboros compile file.ouro [flags]</code> (same options apply to <code>python -m ouroboros file.ouro</code>)','Prepare/lower; add --build or --run for native output/execution.'],['<code>… build file.ouro</code>','Compile and link.'],['<code>… run file.ouro</code>','Compile, link and execute.'],['<code>… play file.ouro|dir/</code>','Run the engine phase host.'],['<code>… check file.ouro --types</code>','Diagnostics and inferred types.'],['<code>… dump-ir file.ouro</code>','Verified IR or unsupported-construct reason.'],['<code>… dump-ast file.ouro</code>','AST inspection.'],['<code>… fmt file.ouro</code>','Currently AST/statement summary—not a source-rewriting formatter.'],['<code>… watch file.ouro</code>','Poll dependencies and rebuild/run.'],['<code>… repl</code>','Persistent line-oriented interpreter.'],['<code>… lsp</code>','Language server over stdio.']])) ,
    section('flags','Common options','<p>The default compile command supports <code>--backend auto|c|x64|legacy</code>, <code>--build</code>, <code>--run</code>, <code>--no-check</code>, and PhysX/toolchain options. Play adds <code>--native</code>, <code>--vulkan</code>, <code>--physx</code>, <code>--frames</code>, <code>--watch</code>, timing controls and a backend choice for native play. Use <code>python -m ouroboros --help</code> and <code>python -m ouroboros play --help</code> for the authoritative current flags.</p>'),
    section('artifacts','Outputs and exit codes','<p>Native artifacts are written under build, with backend-specific generated source and executable outputs. Exact generated files depend on the selected backend and build mode. Compile/build errors return a nonzero status; run behavior propagates/report program failure. Check the CLI output and the build directory rather than relying on one fixed artifact set.</p>'),
    section('regressions','Regression commands', code(`python -m ouroboros.bug_tests --interp-only
python -m ouroboros.bug_tests --c-only --run-timeout 30
python -m ouroboros.bug_tests struct_nested engine_math
python -m unittest discover -s tests -p 'test_*.py'
python tests/perf/run_engine_perf.py --runs 7`, 'Terminal','shell') + '<p>The bug harness compares expected output and backend/interpreter parity. <code>--c-only</code> compares interpreter against C/x64 IR backends; <code>--no-x64</code> excludes x64. Use <code>python -m ouroboros.bug_tests --help</code> for the current options. .no_legacy cases require IR coverage. --run-timeout bounds native executable execution, not every build or interpreter phase.</p>')
  ]);
  add('editor','Tooling & internals','Editor & diagnostics','Make the language visible while you work.',[
    section('vscode','VS Code integration','<p>The repository contains a VS Code extension under editors/vscode for .ouro/.var/.ent grammar and a language-server client. It is a local extension source, not a promise of marketplace distribution. Configure ouroboros.pythonPath and ouroboros.serverCwd to locate Python and the package root.</p>'),
    section('lsp','Language server features','<p>The stdio LSP supports diagnostics, inferred-type hover, go-to-definition, document symbols and completion. Unsaved buffers feed preparation/checking. Dynamic inference and implicit side-file discovery influence what can be resolved; the LSP is not a complete refactoring/debug-adapter suite.</p>'),
    section('error-locations','Reading errors','<p>Front-end spans carry file/line/column information. Include chains identify both parent and child. Legacy generated assembly includes source-line comments, allowing assembler/link diagnostics to map near the originating source. Inspect dump-ir when the problem is backend coverage rather than syntax.</p>')
  ]);
  add('performance','Tooling & internals','Performance & measurement','Native compilation is a starting point, not a C-speed guarantee.',[
    section('perf-guidelines','Choose data representation deliberately','<p>Use fixed structs/slices for contiguous hot data, allocate outside inner loops, and avoid accidentally dynamic accumulators. Prefer statically predictable field arithmetic. General arrays/maps are convenient but introduce tagging, ownership and helper-call costs.</p>'),
    section('perf-measure','Run comparable workloads', code(`python tests/perf/run_engine_perf.py --runs 7 --json build/engine_perf/results_c.json
python tests/perf/run_engine_perf.py --backend x64 --runs 7
python tests/perf/run_perf.py`, 'Terminal','shell') + '<p>The engine runner validates checksums, warms executables and alternates run order. Current results measure whole-process startup + work + output. C references can vectorize and restructure loops; typed slice bounds checks remain enabled.</p>'),
    section('perf-results','Recorded development measurements', table(['Workload','C backend / optimized C time','x64 / optimized C time'],[['Scalar state updates','0.98×','0.95×'],['Contiguous particles','1.43×','2.33×'],['Float transforms','1.13×','1.91×'],['Job graph/wrapper','1.62×','1.76×']]) + '<p>Five-run medians recorded on Windows/MSVC 19.44 after statement-local checked-address reuse. Lower is better. These are not portable guarantees; small scalar differences can be noise. Job worker serialization is retained in the compared implementations.</p>'),
    section('perf-next','What to profile next','<p>Longer kernel-focused workloads, vectorization, hoistable bounds checks, allocation pressure, ECS churn, strings and safe parallel jobs are next targets. The saved JSON and ENGINE_FOUNDATION.md record caveats and current measurements. Do not advertise universal C parity or an Unreal-scale engine from these tests.</p>')
  ]);
  add('files-ent','File types','Entities and components','.ent and .com declare data. Spelling is proposed.',[
    S('decl','Declaring',code(`// Health.com\ncomponent Health\n    current i32 := 100\n\n// Units.ent\nentity Player uses Health, Position\ngroup Players\n    Player`),'<p>The <code>.ent</code> file says which entities and groups use which components. Proposed spelling, pending your sign-off.</p>'),
    S('use','Using them',code(`Players ~[Health.current < 50]~> TriggerWarning\nPlayers ~>> Think`))
  ]);
  add('files-ouro','File types','.ouro: main script and phases','The last file checked, where the program runs.',[
    S('on','Phases',code(`on Start\n    0.0166666667 -> SetFixedDt\non FixedTick\n    Players ~>> Think\non Tick\n    -[Press.Key.Escape]-> Quit\non Shutdown\n    "bye" -> Print`),'<p><code>on</code> blocks are the spelling of the host\'s four phases. They live only in <code>.ouro</code>, one per phase, run top to bottom.</p>')

  add('rendering','Engine','Rendering and materials','Command-oriented, multi-argument calls use the funnel.',[
    S('cam','Cameras and primitives',code(`0.08, 0.1, 0.12 >- SetClearColor\n0.0, 3.0, 8.0, 0.0, 0.0, 0.0, 60.0 >- SetCamera3D\n0.0, 0.0, 0.0, 10.0, 10.0, 0.3, 0.4, 0.3 >- DrawPlane\n0.0, 1.0, 0.0, 0.5, 0.5, 0.5, 0.7, 0.8, 0.5 >- DrawBox`),'<p>Position, half-extents, RGB. Recorded draws are not proof a frame was visible.</p>'),
    S('mat','Lighting',code(`0, 0.7, 0.8, 0.5, 0.6, 0.0 >- SetMaterial\n0 -> UseMaterial\n0.15, 0.15, 0.15 >- SetAmbient\n0.0, -1.0, -0.5, 1.0, 1.0, 1.0 >- SetDirLight`),'<p>Ambient plus Lambert plus Blinn-Phong. Not a full PBR pipeline; shadows and skeletal animation remain milestones.</p>')

  add('media-ui','Engine','Textures, fonts, input and UI','Assets are destinations; input is conditions.',[
    S('tex','Textures',code(`tex := "sprite.png" -> LoadTexture\ntex -> BindTexture\n20.0, 20.0, 64.0, 64.0 >- DrawTexturedQuad`)),
    S('inp','Input',code(`-[Press.Key.Escape]-> Quit\nPlayer -[Hold.Key.W]-> Walk\nPlayer -[Mouse.MoveX > 0]-> TurnRight`),'<p>Mouse coordinates are client pixels, top-left origin.</p>'),
    S('ui','Immediate-mode UI',code(`-> UiBegin\n10.0, 10.0, 260.0, 150.0 >- UiPanel\nvalue =: 0.5\nvalue = 20.0, 50.0, 180.0, value, 0.0, 1.0 >- UiSlider\n20.0, 115.0, 100.0, 24.0, "Quit" >- UiButton -[ true -> Quit ]-> Done\n-> UiEnd`),'<p>Widget IDs follow call order, so keep it stable.</p>')

  add('audio','Engine','Sound and streaming music','Soft test model versus live audio.',[

  add('physics','Engine','Physics','Built-in box world, optional PhysX.',[
    S('box','Box world',code(`0.0, -9.81, 0.0 >- PhysGravity\nfloor := 0.0, -1.0, 0.0, 10.0, 0.5, 10.0, 0.0 >- BodyBox\nbox := 0.0, 3.0, 0.0, 0.5, 0.5, 0.5, 1.0 >- BodyBox\n0.0166666667 -> PhysStep\ny := box -> BodyY\ny * 100.0 -> i32 -> Print`),'<p>Mass zero is static. No rotation or friction in the built-in solver.</p>')
  ]);
  add('cpp','Comparison','C++ comparison','Specification examples. The Ouroboros side is design, not compiled output.',[
    S('sph','1. Particle density',code(`// C++\nfor (auto& p : particles) {\n  float d = 0;\n  for (auto& n : grid.neighbors(p)) d += kernel(p, n);\n  p.density = d;\n}`,'C++','cpp'),code(`Particles ~<| Neighbors >- Σ -> Density`)),
    S('jobs','2. Parallel work',code(`// C++\nstd::vector<std::future<void>> f;\nfor (auto& e : enemies) f.push_back(std::async(think, std::ref(e)));\nfor (auto& x : f) x.get();`,'C++','cpp'),code(`Enemies ~>> Think`)),
    S('react','3. Reactive binding',code(`// C++\nstruct Q { int v; std::function<void(int)> on; void set(int x){ v=x; if(on) on(x);} };\nq.on = [&](int x){ doubled = x * 2; };`,'C++','cpp'),code(`doubled =: 0\nQ -|> Double -> doubled`)),
    S('own','4. Shared ownership',code(`// C++\nauto tex = std::make_shared<Texture>("wall.png");\nrenderer.add(tex); minimap.add(tex);\ntex.reset();`,'C++','cpp'),code(`cache shared Texture := "wall.png" -> LoadTexture\ncache -+-> Renderer, Minimap\ncache -|->`))
  ]);

  add('rules','Reference','Resolved design rules','Seven rules that were open before coding the arrows.',[
    S('r','Rules',t(['#','Rule','Example'],[
      ['1','Reactive <code>-|></code> is change-driven. It runs once when bound, then whenever the left side is written. It needs no clock, so headless scripts work.',K('Q -|> Double -> doubled')],
      ['2','A comma on the left of <code>-></code> is an error ("use <code>>-</code>"). Commas mean several inputs only in the funnel, and several holders only on the right of <code>-+-></code>.',K('a, b >- Print')],
      ['3','<code>Fail</code> carries a <code>str</code> message and is caught by <code>?-></code>. An uncaught <code>Fail</code> ends the current phase and reports the message; a headless run exits with an error.',K('"bad" -[x < 0]-> Fail')],
      ['4','<code>on</code> blocks are the spelling of the host\'s four phases. They live only in <code>.ouro</code>, one per phase, top to bottom.',K('on Tick')],
      ['5','Every range is inclusive, including slice destinations. The end-exclusive <code>Slice(arr, a, b)</code> is retired in the Ouro dialect.',K('Scores[1..3]')],
      ['6','Position decides. A type name after a name is a type; on the right of an arrow it is a conversion.',K('speed i32 := Raw -> i32')],
      ['7','Traits are implicit by default. Explicit <code>trait</code>/<code>impl</code> stays supported as an optional form.','Ouro spelling TBD']]))
  ]);
  add('cpp2','Comparison','C++ comparison, part two','More specification examples. The Ouroboros side is design, not compiled output.',[
    S('fluid','5. Fluid solver (SPH step)',code(`// C++ (density, pressure, force, integrate)\nfor (auto& p : ps) {\n  float d = 0;\n  for (auto& n : grid.near(p)) d += W(p.x - n.x, h);\n  p.rho = d;\n  p.P = k * (p.rho - rho0);\n}\nfor (auto& p : ps) {\n  Vec f{};\n  for (auto& n : grid.near(p))\n    f -= (p.P + n.P) / (2 * n.rho) * gradW(p.x - n.x, h);\n  p.v += f / p.rho * dt;\n  p.x += p.v * dt;\n}`,'C++','cpp'),code(`@Calculus\n    Particles ~<| Neighbors >- Σ W -> Density\n    P := k * (Density - rho0)\n    force := -(∇ P) / Density\nParticles ~> Integrate`),'<p>The pressure gradient is written as <code>∇ P</code> and compiled as real autodiff. In the IDE the fraction is a stacked fraction.</p>'),
    S('async','6. Async plus bidirectional sync',code(`// C++\nstd::mutex m; std::condition_variable cv;\nvoid net(){ for(;;){ std::unique_lock l(m); cv.wait(l,[]{return dirty;});\n  server.health = local.health; dirty=false; } }\nstd::thread t(net);\nvoid setHealth(int h){ { std::lock_guard l(m); local.health=h; dirty=true;} cv.notify_one(); }`,'C++','cpp'),code(`Local.health <<|-|> Server.health\nInputs ~>> Send -> Server`),'<p><code><<|-|></code> is a continuous async bind. Cross-file means threads, so the boundary needs thread-safe types.</p>'),
    S('input','7. Input handling',code(`// C++\nif (key[W] && key[SHIFT]) player.sprint();\nelse if (key[W]) player.walk();\nif (mouse.left) player.shoot();`,'C++','cpp'),code(`Player -[ Hold.Key.W && Hold.Key.Shift -> Sprint | Hold.Key.W -> Walk ]-> Move\nPlayer -[Hold.Mouse.Left]-> Shoot`)),
    S('ecs','8. ECS query',code(`// C++ (EnTT)\nfor (auto e : reg.view<Health>()) {\n  if (reg.get<Health>(e).current < 50) warn(e);\n}`,'C++','cpp'),code(`Players ~[Health.current < 50]~> TriggerWarning`)),
    S('err','9. Error handling',code(`// C++\nauto r = parse(read(path));\nif (!r) { log(r.error()); return; }\nuse(*r);`,'C++','cpp'),code(`path -> ReadFile ?-> LogError -> Parse -> Use`)),
    S('ad','10. Autodiff',code(`// C++ (hand-written derivative)\nfloat f(float x){ return x*x*sin(x); }\nfloat df(float x){ return 2*x*sin(x) + x*x*cos(x); }`,'C++','cpp'),code(`@Calculus\n    f := x^2 * sin(x)\n    df := ∇ f`),'<p>The derivative is generated at compile time, so it cannot drift out of sync with <code>f</code>.</p>'),
    S('loop','11. Conditional loop with early exit',code(`// C++\nint i = 0; bool found = false;\nwhile (i < 10 && !found) { found = search(i); ++i; }`,'C++','cpp'),code(`i =: 0\nfound =: false\n~[i < 10 && !found]~> Search`))
  ]);

  return {pages, esc};
})();
</script><script>window.OURO_API = (() => {
  const out = [];

</script><script>(() => {
  'use strict';
  const {pages, esc} = window.OURO_DOCS;

  function renderApi(query='') {

    const changed=currentPage!==page.id;
    if(changed){
      currentPage=page.id;
      document.title=`${page.id==='overview'?'Introduction':page.title} — Ouroboros documentation`;
      $('breadcrumb').innerHTML=`<span>Documentation</span><span>›</span><span>${esc(page.group)}</span>`;
      const words=plain(page.sections.join(' ')).split(' ').length;

  }

    }catch{toast('Clipboard unavailable. Select and copy the code manually.');}
  });
  function selectResult(index){const links=[...$('search-results').querySelectorAll('a')];if(!links.length)return;resultIndex=(index+links.length)%links.length;links.forEach((a,i)=>a.classList.toggle('selected',i===resultIndex));links[resultIndex].scrollIntoView({block:'nearest'});}
  function search() {
    const query=$('search-input').value.toLowerCase().trim();
    const terms=query.split(/\s+/).filter(Boolean);
    const ranked=entries.map(e=>{const title=e.title.toLowerCase(),body=e.text.toLowerCase(),group=e.group.toLowerCase();const matched=terms.every(t=>title.includes(t)||body.includes(t)||group.includes(t));const score=terms.reduce((n,t)=>n+(title===t?100:title.startsWith(t)?30:title.includes(t)?15:group.includes(t)?5:1),0);return{...e,matched,score};}).filter(e=>e.matched).sort((a,b)=>b.score-a.score).slice(0,25);
    $('search-results').innerHTML=ranked.map(e=>{let at=query?e.text.toLowerCase().indexOf(terms[0]):-1;let text=e.text.slice(Math.max(0,at-35),Math.max(0,at-35)+145);return`<a class="search-result" href="#${e.route}"><strong>${esc(e.title)}</strong><small>${esc(e.group)} · ${esc(text)}${e.text.length>145?'…':''}</small></a>`;}).join('')||'<div class="search-empty">No results. Try a shorter term or a builtin name.</div>';
    resultIndex=-1;if(ranked.length)selectResult(0);
  }
  function openSearch(){search();$('search-dialog').showModal();$('search-input').focus();}
  $('search-open').addEventListener('click',openSearch);
  $('search-close').addEventListener('click',()=>$('search-dialog').close());
  $('search-input').addEventListener('input',search);
  $('search-results').addEventListener('click',e=>{if(e.target.closest('a'))$('search-dialog').close();});
  $('search-dialog').addEventListener('click',e=>{if(e.target===$('search-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
  $('search-input').addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();selectResult(resultIndex+(e.key==='ArrowDown'?1:-1));}if(e.key==='Enter'){const result=$('search-results').querySelectorAll('a')[Math.max(0,resultIndex)];if(result){e.preventDefault();result.click();}}});
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('search-dialog').open)openSearch();}if(e.key==='Escape')closeMenu();});

})();
